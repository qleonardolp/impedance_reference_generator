quadruped_control:
  control_topics: {
    type: string_array,
    description: "Names of the reference topics for each leg controller.
    Sequence: front left (FL), front right (FR), rear left (RL), rear right (RR).",
    validation: {
      fixed_size<>: [4]
    }
  }
  fl_offset: {
    type: double_array,
    default_value: [],
    description: "FL trunk x-y-z offset.",
    validation: {
      fixed_size<>: [3]
    }
  }
  fr_offset: {
    type: double_array,
    default_value: [],
    description: "FR trunk x-y-z offset.",
    validation: {
      fixed_size<>: [3]
    }
  }
  rl_offset: {
    type: double_array,
    default_value: [],
    description: "RL trunk x-y-z offset.",
    validation: {
      fixed_size<>: [3]
    }
  }
  rr_offset: {
    type: double_array,
    default_value: [],
    description: "RR trunk x-y-z offset.",
    validation: {
      fixed_size<>: [3]
    }
  }
  body_height: {
    type: double,
    default_value: 0.0,
    description: "Nominal robot trunk height relative to the ground.",
  }
  amplitude: {
    type: double,
    default_value: 0.010,
    description: "Amplitude of the reference signal. For a step input, it is the step height.
    For a sine wave, it is the peak deviation from zero.",
  }
  rate: {
    type: int,
    default_value: 100,
    description: "Publisher rate in Hertz (Hz).",
    validation: {
      gt<>: [0.0]
    }
  }
  cpg_length: {
    type: double,
    default_value: 0.3,
    description: "Central Pattern Generator step length.",
    validation: {
      gt<>: [0.0]
    }
  }
  cpg_robot_height: {
    type: double,
    default_value: 0.4,
    description: "Robot height for Central Pattern Generator.",
    validation: {
      gt<>: [0.0]
    }
  }
  cpg_x_offset: {
    type: double,
    default_value: 0.0,
    description: "Step x offset for Central Pattern Generator.",
  }
